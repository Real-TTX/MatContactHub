# MatContactHub - Development (branch dev, image :nightly) with pgAdmin
#   docker compose -f docker-compose.dev.yml up -d
#   App:     http://localhost:7087
#   LDAP:    ldap://localhost:7389    (plain and StartTLS; the container listens on 10389)
#   LDAPS:   ldaps://localhost:7636   (the container listens on 10636)
#   pgAdmin: http://localhost:7088   (no sign-in; database password: matcontacthub)
# Optional under "environment:" of web (comments only, nothing to set): MAT_PUBLIC_URL, MAT_API_KEY, MAT_FRAME_ANCESTORS, MATIDENTITY_*, MATSMTP_*
# (see docker-compose.yml).
name: matcontacthub-dev

services:
  web:
    image: ghcr.io/real-ttx/matcontacthub:nightly
    restart: unless-stopped
    ports:
      - "7087:7087"
      - "7389:10389"
      - "7636:10636"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matcontacthub
      POSTGRES_USER: matcontacthub
      POSTGRES_PASSWORD: matcontacthub
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matcontacthub -d matcontacthub"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "7088:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matcontacthub.example.com
      PGADMIN_DEFAULT_PASSWORD: matcontacthub
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "MatContactHub", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "matcontacthub", "Username": "matcontacthub", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:
